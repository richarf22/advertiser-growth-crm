spring.sql.init.platform=postgres
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/growthcrm}
spring.datasource.username=${POSTGRES_USER:growthcrm}
spring.datasource.password=${POSTGRES_PASS:growthcrm}
# SQL is written to be idempotent so this is safe
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate
